      summary: Auto-create guardian records from existing guardianCnic data on students
      responses:
        "200":
          description: Backfill result
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GuardianBackfillResult" }
        "401": { description: Not authenticated, content: { application/json: { schema: { $ref: "#/components/schemas/ApiErrorResponse" } } } }
  /admin/guardians/search:
    get:
      operationId: searchAdminGuardians
      tags: [admin]
      summary: Lightweight guardian search for combobox dropdowns
      parameters:
        - { name: q, in: query, required: true, schema: { type: string, minLength: 2 }, description: "Search term (min 2 chars) — matches name, CNIC, phone, email" }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 50, default: 10 } }
      responses:
        "200":
          description: Matching guardians
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GuardianSearchPage" }
        "400": { description: q param required, content: { application/json: { schema: { $ref: "#/components/schemas/ApiErrorResponse" } } } }
        "401": { description: Not authenticated, content: { application/json: { schema: { $ref: "#/components/schemas/ApiErrorResponse" } } } }
  /admin/guardians/{id}:
    get:
      operationId: getAdminGuardian
      tags: [admin]
      summary: Guardian detail with linked children
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Guardian detail
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GuardianDetail" }
        "404": { description: Not found, content: { application/json: { schema: { $ref: "#/components/schemas/ApiErrorResponse" } } } }
    patch:
      operationId: updateAdminGuardian
      tags: [admin]
      summary: Update guardian details
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GuardianInput" }
      responses:
        "200":
          description: Updated guardian
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GuardianDetail" }
        "404": { description: Not found, content: { application/json: { schema: { $ref: "#/components/schemas/ApiErrorResponse" } } } }
        "409": { description: CNIC conflict, content: { application/json: { schema: { $ref: "#/components/schemas/ApiErrorResponse" } } } }
    delete:
      operationId: deleteAdminGuardian
      tags: [admin]
      summary: Delete a guardian (only if no linked students)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeleteResult" }
        "404": { description: Not found, content: { application/json: { schema: { $ref: "#/components/schemas/ApiErrorResponse" } } } }
        "409": { description: Still has linked students, content: { application/json: { schema: { $ref: "#/components/schemas/ApiErrorResponse" } } } }
  /admin/students/{id}/guardian:
    patch:
