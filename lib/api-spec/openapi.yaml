      operationId: getAdminBatchPrintStudentStatus
      tags: [admin]
      summary: Get print status for a list of students for a given document type
      security:
        - bearerAuth: []
      parameters:
        - { name: documentType, in: query, required: true, schema: { type: string } }
        - { name: academicYearId, in: query, required: false, schema: { type: string, format: uuid } }
        - { name: studentIds, in: query, required: true, schema: { type: string }, description: "Comma-separated student UUIDs" }
