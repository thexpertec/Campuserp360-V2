  # ── Admin: Career Applications ────────────────────────────────────────────

  /admin/career-applications:
    get:
      operationId: adminListCareerApplications
      summary: Paginated list of career applications (admin)
      tags: [Careers]
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: page
          schema: { type: integer, default: 1 }
        - in: query
          name: pageSize
          schema: { type: integer, default: 20 }
        - in: query
          name: q
          schema: { type: string }
        - in: query
          name: status
          schema: { type: string }
      responses:
        "200":
          description: Paginated applications
          content:
            application/json:
              schema:
                type: object
                required: [total, page, pageSize, items]
                properties:
                  total:    { type: integer }
                  page:     { type: integer }
                  pageSize: { type: integer }
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/CareerApplicationSummary"

  /admin/career-applications/{id}:
    get:
      operationId: adminGetCareerApplication
      summary: Full detail for one career application
      tags: [Careers]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Full application detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CareerApplicationDetail"

  /admin/career-applications/{id}/status:
    patch:
      operationId: adminUpdateCareerApplicationStatus
      summary: Update application review status
      tags: [Careers]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [new, reviewed, shortlisted, rejected]
      responses:
        "200":
          description: Updated application
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CareerApplicationDetail"

  /admin/coa/batch:
    post:
      operationId: batchCreateCoaAccounts
      summary: Batch-create multiple COA accounts in a single transaction
      tags: [admin]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [accounts]
              properties:
                accounts:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required: [code, name, type, kind, normalBalance]
                    properties:
                      code:          { type: string }
                      name:          { type: string }
                      type:          { type: string, enum: [asset, liability, equity, income, expense] }
                      kind:          { type: string, enum: [group, ledger] }
                      normalBalance: { type: string, enum: [dr, cr] }
                      parentId:      { type: string, nullable: true }
                      description:   { type: string, nullable: true }
                      sortOrder:     { type: integer }
      responses:
        "201":
          description: Accounts created
          content:
            application/json:
              schema:
                type: object
                properties:
                  created:
                    type: array
                    items: { type: object }
                  errors:
                    type: array
                    items: { type: string }
        "400":
          description: Validation error
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiErrorResponse" }
        "409":
          description: Duplicate account code
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiErrorResponse" }

components:
  schemas:
    HealthStatus:
      type: object
