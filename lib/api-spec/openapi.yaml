        - { name: sortDir, in: query, required: false, schema: { type: string, enum: [asc, desc] }, description: "Sort direction for primary column" }
        - { name: sort, in: query, required: false, schema: { type: string }, description: "Multi-column sort (comma-separated key:dir pairs)" }
      responses:
        "200":
          description: Paginated guardian list
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GuardianPage" }
        "401": { description: Not authenticated, content: { application/json: { schema: { $ref: "#/components/schemas/ApiErrorResponse" } } } }
    post:
      operationId: createAdminGuardian
      tags: [admin]
      summary: Create a new guardian record
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GuardianInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GuardianDetail" }
        "400": { description: Validation error, content: { application/json: { schema: { $ref: "#/components/schemas/ApiErrorResponse" } } } }
        "409": { description: CNIC conflict, content: { application/json: { schema: { $ref: "#/components/schemas/ApiErrorResponse" } } } }
  /admin/guardians/backfill:
    post:
      operationId: backfillAdminGuardians
