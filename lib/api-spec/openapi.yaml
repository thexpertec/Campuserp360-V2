        - bearerAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Batch print job detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BatchPrintJobDetailResponse"
        "404": { description: Not found, content: { application/json: { schema: { $ref: "#/components/schemas/ApiErrorResponse" } } } }
        "500": { description: Server error, content: { application/json: { schema: { $ref: "#/components/schemas/ApiErrorResponse" } } } }

  /admin/batch-print-jobs/{id}/print:
    patch:
      operationId: markAdminBatchPrintJobPrinted
      tags: [admin]
      summary: Mark a batch print job as printed
      security:
        - bearerAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Job marked as printed
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok: { type: boolean }
        "404": { description: Not found, content: { application/json: { schema: { $ref: "#/components/schemas/ApiErrorResponse" } } } }
        "500": { description: Server error, content: { application/json: { schema: { $ref: "#/components/schemas/ApiErrorResponse" } } } }


