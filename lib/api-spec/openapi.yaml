  /admin/applications/bulk-enroll:
    post:
      operationId: bulkEnrollAdminApplications
      tags: [admin]
      summary: Bulk-enroll multiple admitted applicants in one request
      description: >
        Accepts an array of enrollment items. Each item is enrolled using the
        same logic as the single-enroll endpoint. Failures for individual items
        do not abort the rest — the response always contains a per-item
        success/error summary. Only applicants in `admitted` status can be
        enrolled; others are skipped with an error.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BulkEnrollRequest"
      responses:
        "200":
          description: Results for each enrollment item (partial success possible)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BulkEnrollResult"
        "400":
          description: Invalid request body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
  /admin/applications/{referenceId}/enroll:
    post:
      operationId: enrollAdminApplication
      tags: [admin]
      summary: Enroll an admitted applicant as a student (creates a student record)
      description: >
        Requires the application to be in `admitted` status. Inside a single
        transaction: (1) creates a student row populated from the application
        fields; (2) copies `sectionId` and `academicYearId` from
        `section_allocations` if a placement exists for this application;
        (3) updates `applications.status` to `enrolled`; (4) appends an
        `application_events` row with `eventType: enrolled`.
      parameters:
        - name: referenceId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EnrollRequest"
      responses:
        "201":
          description: Cadet enrolled successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnrollResult"
        "400":
          description: Applicant not in admitted status or missing Applicant ID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "404":
          description: Application not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "409":
          description: Already enrolled or Applicant ID conflict
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
