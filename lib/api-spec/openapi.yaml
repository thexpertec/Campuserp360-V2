  /admin/batch-print-jobs:
    get:
      operationId: listAdminBatchPrintJobs
      tags: [admin]
      summary: List batch print jobs with optional filters
      security:
        - bearerAuth: []
      parameters:
        - { name: documentType,   in: query, required: false, schema: { type: string } }
        - { name: academicYearId, in: query, required: false, schema: { type: string, format: uuid } }
        - { name: status,         in: query, required: false, schema: { type: string } }
        - { name: generatedAfter, in: query, required: false, schema: { type: string, format: date-time }, description: "Filter jobs generated at or after this ISO 8601 datetime" }
        - { name: generatedBefore, in: query, required: false, schema: { type: string, format: date-time }, description: "Filter jobs generated at or before this ISO 8601 datetime" }
        - { name: page,           in: query, required: false, schema: { type: integer, minimum: 1 } }
        - { name: pageSize,       in: query, required: false, schema: { type: integer, minimum: 1, maximum: 100 } }
      responses:
        "200":
          description: Paginated list of batch print jobs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BatchPrintJobListResponse"
        "500": { description: Server error, content: { application/json: { schema: { $ref: "#/components/schemas/ApiErrorResponse" } } } }
    post:
      operationId: createAdminBatchPrintJob
      tags: [admin]
      summary: Create a batch print job for selected students
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateBatchPrintJobBody"
      responses:
        "201":
          description: Batch job created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BatchPrintJobResponse"
        "409":
          description: Duplicate records detected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BatchPrintDuplicatesResponse"
        "400": { description: Validation error, content: { application/json: { schema: { $ref: "#/components/schemas/ApiErrorResponse" } } } }
        "500": { description: Server error, content: { application/json: { schema: { $ref: "#/components/schemas/ApiErrorResponse" } } } }

