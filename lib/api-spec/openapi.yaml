openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: applications
    description: Admission applications
  - name: admin
    description: Admin dashboard (back-office)
  - name: saas-admin
    description: SaaS super-admin — tenant management and impersonation
  - name: website
    description: Public website dynamic content (events, gallery, downloads, faculty, fee structure, page blocks)
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /applications/stats:
    get:
      operationId: getApplicationStats
      tags: [applications]
      summary: Live admissions counter for the current session
      responses:
        "200":
          description: Aggregate counts for the current admissions session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplicationStats"
  /applications:
    post:
      operationId: submitApplication
      tags: [applications]
      summary: Submit a new admission application
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApplicationInput"
      responses:
        "201":
          description: Application created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplicationSummary"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "500":
          description: Server error while saving the application
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
  /applications/lookup:
    post:
      operationId: lookupApplication
      tags: [applications]
      summary: Look up an application by reference ID and last 4 digits of parent CNIC
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApplicationLookup"
      responses:
        "200":
          description: Application details with timeline
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplicationDetail"
        "400":
          description: Invalid lookup request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "404":
          description: No application matches the reference ID and CNIC
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "429":
          description: Too many lookup attempts. Try again later.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "500":
          description: Server error during lookup
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
  /public/classes:
    get:
      operationId: listPublicClasses
      tags: [applications]
      summary: Public list of active admission classes
      responses:
        "200":
          description: Active classes ordered by sortOrder
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PublicClassItem"
  /admin/login:
    post:
      operationId: adminLogin
      tags: [admin]
      summary: Authenticate an admin user and receive a session token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminCredentials"
      responses:
        "200":
          description: Authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSession"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
  /admin/me:
    get:
      operationId: getAdminMe
      tags: [admin]
      summary: Return the currently authenticated admin user
      responses:
        "200":
          description: The current admin user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUser"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
  /admin/dashboard/summary:
    get:
      operationId: getAdminDashboardSummary
      tags: [admin]
      summary: Aggregate counts and recent activity for the admin dashboard
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminDashboardSummary"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
  /admin/applications:
    get:
      operationId: listAdminApplications
      tags: [admin]
      summary: Paginated, filterable list of applications
      parameters:
        - name: q
          in: query
          required: false
          schema: { type: string }
          description: Free-text search across name and reference ID
        - name: status
          in: query
          required: false
          schema: { type: string }
        - name: classApplying
          in: query
          required: false
          schema: { type: string }
        - name: examCenter
          in: query
          required: false
          schema: { type: string }
        - name: session
          in: query
          required: false
          schema: { type: string }
        - name: gender
          in: query
          required: false
          schema: { type: string, enum: [male, female, other] }
          description: Filter by gender
        - name: page
          in: query
          required: false
          schema: { type: integer, minimum: 1, default: 1 }
        - name: pageSize
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
        - name: sortBy
          in: query
          required: false
          schema:
            type: string
            enum: [referenceId, name, fatherName, class, createdAt, city, feeStatus, status]
          description: Primary column to sort by (single-sort)
        - name: sortDir
          in: query
          required: false
          schema: { type: string, enum: [asc, desc] }
          description: Sort direction for primary column
        - name: sort
          in: query
          required: false
          schema: { type: string }
          description: "Multi-column sort (comma-separated key:dir pairs, e.g. name:asc,class:desc)"
        - name: duplicatesOnly
          in: query
          required: false
          schema: { type: boolean }
          description: When true, return only applications that share student email, mobile, or B-form with another application in the same session
      responses:
        "200":
          description: A page of applications
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminApplicationsPage"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
  /admin/applications/status-counts:
    get:
      operationId: getAdminApplicationStatusCounts
      tags: [admin]
      summary: Counts of applications grouped by status for the tenant
      responses:
        "200":
          description: Status counts for the tenant
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminApplicationStatusCounts"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
  /admin/applications/{referenceId}:
    get:
      operationId: getAdminApplication
      tags: [admin]
      summary: Full application record with timeline
      parameters:
        - name: referenceId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Application detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminApplicationDetail"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
  /admin/applications/{referenceId}/duplicates:
    get:
      operationId: getAdminApplicationDuplicates
      tags: [admin]
      summary: List other applications sharing email, mobile, or B-form with this applicant
      parameters:
        - name: referenceId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Duplicate candidates found (empty array when none)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminApplicationDuplicatesResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
  /admin/applications/{referenceId}/info:
    patch:
      operationId: updateAdminApplicationInfo
      tags: [admin]
      summary: Update editable personal, contact, and address fields on an application
      parameters:
        - name: referenceId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminApplicationInfoUpdate"
      responses:
        "200":
          description: Updated application detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminApplicationDetail"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
  /admin/applications/{referenceId}/status:
    patch:
      operationId: updateAdminApplicationStatus
      tags: [admin]
      summary: Change an application's lifecycle status and record a timeline event
      parameters:
        - name: referenceId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminStatusUpdate"
      responses:
        "200":
          description: Updated application detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminApplicationDetail"
        "400":
          description: Invalid status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
  /admin/applications/{referenceId}/test:
    patch:
      operationId: assignAdminApplicationTest
      tags: [admin]
      summary: Assign roll number, test date and centre, moving the application to Entry Test Scheduled
      parameters:
        - name: referenceId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminTestAssignment"
      responses:
        "200":
          description: Updated application detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminApplicationDetail"
        "400":
          description: Invalid test assignment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
  /admin/applications/{referenceId}/result:
    patch:
      operationId: recordAdminApplicationResult
      tags: [admin]
      summary: Record entry-test marks and publish a result/decision
      parameters:
        - name: referenceId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminResultEntry"
      responses:
        "200":
          description: Updated application detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminApplicationDetail"
        "400":
          description: Invalid result entry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
  /admin/applications/{referenceId}/events:
    post:
      operationId: addAdminApplicationEvent
      tags: [admin]
      summary: Append a timeline note/event to an application
      parameters:
        - name: referenceId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminEventInput"
      responses:
        "200":
          description: Updated application detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminApplicationDetail"
        "400":
          description: Invalid event
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
  /admin/applications/document-verification:
    get:
      operationId: listAdminApplicationDocumentVerification
      tags: [admin]
      summary: Paginated checklist of applications pending document verification
      parameters:
        - name: q
          in: query
          required: false
          schema: { type: string }
        - name: classApplying
          in: query
          required: false
          schema: { type: string }
        - name: verified
          in: query
          required: false
          schema: { type: string }
          description: "Filter by doc verification status: 'true' | 'false'"
        - name: page
          in: query
          required: false
          schema: { type: integer, minimum: 1, default: 1 }
        - name: pageSize
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        "200":
          description: A page of document verification records
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentVerificationPage"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
  /admin/applications/{referenceId}/verify-docs:
    patch:
      operationId: verifyAdminApplicationDocs
      tags: [admin]
      summary: Bulk verify or unverify all attached documents for an application
      parameters:
        - name: referenceId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerifyDocsBody"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                type: object
                required: [success, verified]
                properties:
                  success: { type: boolean }
                  verified: { type: boolean }
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
  /admin/applications/bulk/status:
    post:
      operationId: bulkUpdateAdminApplicationStatus
      tags: [admin]
      summary: Update the status of many applications at once
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BulkStatusUpdate"
      responses:
        "200":
          description: Bulk update result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BulkActionResult"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
  /admin/applications/bulk/schedule:
    post:
      operationId: bulkScheduleAdminApplicationTest
      tags: [admin]
      summary: Schedule the entry test for many applications and auto-assign roll numbers
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BulkTestSchedule"
      responses:
        "200":
          description: Bulk schedule result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BulkScheduleResult"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
  /admin/applications/schedule-all:
    post:
      operationId: scheduleAllAdminApplications
      tags: [admin]
      summary: Resolve the matching applicant pool server-side by filter and schedule entry tests
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScheduleAllBody"
      responses:
        "200":
          description: Schedule result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScheduleAllResult"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
  /admin/applications/bulk/result:
    post:
      operationId: bulkRecordAdminApplicationResult
      tags: [admin]
      summary: Record entry-test marks for many applications at once
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BulkResultRecord"
      responses:
        "200":
          description: Bulk result outcome
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BulkResultOutcome"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
  /admin/applications/bulk/interview:
    post:
      operationId: bulkRecordAdminApplicationInterview
      tags: [admin]
      summary: Record interview marks for many applications at once
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BulkInterviewRecord"
      responses:
        "200":
          description: Bulk interview outcome
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BulkInterviewOutcome"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
  /admin/applications/bulk/marks:
    patch:
      operationId: bulkUpdateAdminApplicationMarks
      tags: [admin]
      summary: Update academic %, entry-test and interview marks for many applications at once
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BulkMarksUpdate"
      responses:
        "200":
          description: Bulk marks update outcome
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BulkMarksOutcome"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
  /admin/applications/bulk/schedule-interview:
    post:
      operationId: bulkScheduleAdminApplicationInterview
      tags: [admin]
      summary: Schedule interviews for many applications at once
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BulkInterviewSchedule"
      responses:
        "200":
          description: Bulk interview schedule result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BulkInterviewScheduleResult"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
  /admin/applications/interview-performa:
    get:
      operationId: listAdminInterviewPerforma
      tags: [admin]
      summary: List candidates for interview scoring performa
      parameters:
        - name: classApplying
          in: query
          required: false
          schema: { type: string }
        - name: q
          in: query
          required: false
          schema: { type: string }
        - name: page
          in: query
          required: false
          schema: { type: integer, minimum: 1, default: 1 }
        - name: pageSize
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 500, default: 200 }
      responses:
        "200":
          description: Interview performa candidates
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InterviewPerformaPage"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
  /admin/applications/bulk/interview-performa:
    patch:
      operationId: bulkSaveInterviewPerforma
      tags: [admin]
      summary: Save per-criterion interview scores (6 criteria × 10 marks) for many candidates
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BulkInterviewPerformaUpdate"
      responses:
        "200":
          description: Save outcome
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BulkInterviewPerformaOutcome"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
  /admin/applications/bulk-update-doc-verification:
    patch:
      operationId: bulkUpdateDocVerification
      tags: [admin]
      summary: Bulk-update document verification fields for multiple applications
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BulkUpdateDocVerificationBody"
      responses:
        "200":
          description: Number of rows updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BulkUpdateResult"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
  /admin/applications/bulk-update-entry-test:
    patch:
      operationId: bulkUpdateEntryTest
      tags: [admin]
      summary: Bulk-update entry test fields for multiple applications
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BulkUpdateEntryTestBody"
      responses:
        "200":
          description: Number of rows updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BulkUpdateResult"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
  /admin/applications/bulk-update-interview:
    patch:
      operationId: bulkUpdateInterview
      tags: [admin]
      summary: Bulk-update interview metadata fields for multiple applications
      requestBody:
        required: true
        content:
          application/json:
            schema:
