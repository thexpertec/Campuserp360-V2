              schema:
                $ref: "#/components/schemas/StudentPrintStatusResponse"
        "500": { description: Server error, content: { application/json: { schema: { $ref: "#/components/schemas/ApiErrorResponse" } } } }

  /admin/batch-print-jobs/{id}:
    get:
      operationId: getAdminBatchPrintJob
