kind = "api"
previewPath = "/api" # TODO - should be excluded from preview in the first place
title = "API Server"
version = "1.0.0"
id = "3B4_FFSkEVBkAeYMFRJ2e"

[[services]]
localPort = 8080
name = "API Server"
paths = ["/api"]

[services.development]
run = "pnpm --filter @workspace/api-server run dev"

[services.production]

[services.production.build]
# Builds composite libs, the api-server bundle, all three vite frontends
# (each with its correct BASE_PATH), and the Streamlit python deps.
args = ["bash", "scripts/build-prod.sh"]

[services.production.build.env]
NODE_ENV = "production"

[services.production.run]
# Run the api-server bundle directly. The platform now routes each artifact
# independently (static builds for the 3 frontends, candidate-portal as its
# own runnable artifact on its own port) — this service only needs to serve
# /api + /uploads on its assigned $PORT. Do NOT reintroduce the old
# scripts/start-prod.sh wrapper here: it also spawns its own internal gateway
# and a second copy of the Streamlit candidate-portal on port 8000, which
# collides with the platform's own candidate-portal process and crash-loops
# the deploy (see .agents/memory/prod-candidate-portal-double-launch.md).
args = ["node", "--enable-source-maps", "artifacts/api-server/dist/index.mjs"]

[services.production.run.env]
NODE_ENV = "production"

[services.production.health.startup]
path = "/api/healthz"
