    <!-- Inline theme bootstrap: runs synchronously before first paint so the
         correct data-theme is set before CSS variables are evaluated.
         Without this, :root defaults to the CCM theme for every tenant.

         Resolution order:
           1. ?theme= preview override (admin preview iframe).
           2. URL path slug that is itself a theme name (e.g. /gccm/).
           3. The theme cached in localStorage on the previous visit — this
              covers domain-based tenants whose URL carries no slug prefix,
              eliminating the flash of the wrong theme on every refresh.

         This runs BEFORE the gateway injects window.__TENANT_SLUG__, so it can
         only see the URL path. The cache key and the path-slug + preview logic
         MUST stay in sync with cacheTenantSlug() / isPreviewSession() /
         settingsStorageKey() in src/lib/. -->
    <script>
      (function () {
        try {
          var THEMES = { ccm: 1, gccm: 1, pakmil: 1 };
          var sp = new URLSearchParams(location.search);
          // 1. Explicit preview theme wins.
          var pv = sp.get('theme');
          if (pv && THEMES[pv]) { document.documentElement.setAttribute('data-theme', pv); return; }
          var first = location.pathname.split('/').filter(Boolean)[0] || '';
          // 2. Path slug that is itself a theme name.
          if (THEMES[first]) { document.documentElement.setAttribute('data-theme', first); return; }
          // 3. Don't read cache during an override/preview session — the rendered
          //    tenant may differ from the host's real (cached) tenant.
          if (sp.get('tenant') || sp.get('token') || /[#&](?:cms|preview)=/.test(location.hash || '')) return;
          // Partition key must match cacheTenantSlug(): path slug, else "root".
          var PAGE_ROUTES = { about:1, admissions:1, gallery:1, events:1, contact:1, teachers:1, downloads:1, status:1, alumni:1, results:1, 'fee-structure':1, privacy:1, terms:1, portal:1 };
          var slug = (/^[a-z][a-z0-9-]{1,30}$/.test(first) && !PAGE_ROUTES[first]) ? first : 'root';
          var raw = localStorage.getItem('site-settings-cache:' + location.host + ':' + slug);
          if (raw) {
            var parsed = JSON.parse(raw);
            if (parsed && THEMES[parsed.site_theme]) {
              document.documentElement.setAttribute('data-theme', parsed.site_theme);
            }
          }
        } catch (e) {}
      })();
    </script>
