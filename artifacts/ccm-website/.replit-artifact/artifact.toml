kind = "web"
previewPath = "/"
title = "Cadet College Murree"
version = "1.0.0"
id = "artifacts/ccm-website"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21792

[services.development]
run = "pnpm --filter @workspace/ccm-website run dev"

[services.production]
publicDir = "artifacts/ccm-website/dist/public"
serve = "static"

[services.production.build]
args = ["pnpm", "--filter", "@workspace/ccm-website", "run", "build"]

[services.production.build.env]
BASE_PATH = "/"
PORT = "21792"
NODE_ENV = "production"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21792"
BASE_PATH = "/"
