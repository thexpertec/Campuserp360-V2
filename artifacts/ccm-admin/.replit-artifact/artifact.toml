kind = "web"
previewPath = "/admin/"
title = "CCM Admin"
version = "1.0.0"
id = "artifacts/ccm-admin"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/admin/" ]
localPort = 25521

[services.development]
run = "pnpm --filter @workspace/ccm-admin run dev"

[services.production]
publicDir = "artifacts/ccm-admin/dist/public"
serve = "static"

[services.production.build]
args = ["pnpm", "--filter", "@workspace/ccm-admin", "run", "build"]

[services.production.build.env]
BASE_PATH = "/admin/"
PORT = "25521"
NODE_ENV = "production"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "25521"
BASE_PATH = "/admin/"
